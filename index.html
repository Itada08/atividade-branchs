<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa de Funcionalidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="wrap">

  <header>
    <div class="kicker">exercício de branches — 6 funcionalidades</div>

  </header>

  <footer>seis funcionalidades independentes — cada uma pode virar uma branch própria</footer>

<!-- Funcionalidade 5 -->
<section class="card" id="func-cor-nome">
  <h2><span class="num">05</span>Mudar a cor do nome</h2>
  <p class="hint">Digite um nome e escolha uma cor.</p>
  <div class="row" style="margin-bottom:14px;">
    <input type="text" id="input-nome-cor" placeholder="Digite um nome" value="Chico">
    <button id="btn-atualizar-nome-cor">Atualizar nome</button>
  </div>
  <p id="nome-colorido">Chico</p>
  <div class="swatches">
    <button class="swatch" style="background:#0F6E5C" data-cor="#0F6E5C" aria-label="Verde"></button>
    <button class="swatch" style="background:#B4461E" data-cor="#B4461E" aria-label="Laranja"></button>
    <button class="swatch" style="background:#2453A6" data-cor="#2453A6" aria-label="Azul"></button>
    <button class="swatch" style="background:#8A3FBF" data-cor="#8A3FBF" aria-label="Roxo"></button>
    <button class="swatch" style="background:#16181D" data-cor="#16181D" aria-label="Preto"></button>
  </div>
</section>
